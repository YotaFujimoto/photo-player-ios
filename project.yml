name: PhotoPlayer
options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: '27.1'
  deploymentTarget:
    iOS: '17.0'
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PhotoPlayer:
    type: application
    platform: iOS
    sources:
      - path: PhotoPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.photoplayer.p6a936d329b934a8ba532081564a51c07
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PhotoPlayer/Info.plist
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_TESTABILITY: YES
  PhotoPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoPlayerTests
      - path: build/frame-fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: PhotoPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.photoplayer.p6a936d329b934a8ba532081564a51c07.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PhotoPlayer.app/PhotoPlayer
        BUNDLE_LOADER: $(TEST_HOST)
  PhotoPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhotoPlayerUITests
    dependencies:
      - target: PhotoPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.photoplayer.p6a936d329b934a8ba532081564a51c07.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PhotoPlayer
schemes:
  PhotoPlayer:
    build:
      targets:
        PhotoPlayer: all
    run:
      config: Debug
      # Compare media timing without the development-only semaphore interposer.
      # Functional XCTest assertions, deadlines and the Release binary stay intact.
      disableThreadPerformanceChecker: true
    test:
      config: Release
      # CI uses assertions/xcresult plus external live stack capture, not LLDB.
      # The failed launch waited inside Xcode before the app process existed.
      debugEnabled: false
      gatherCoverageData: false
      preferredScreenCaptureFormat: screenshots
      environmentVariables:
        OS_ACTIVITY_MODE: disable
      targets:
        - PhotoPlayerTests
        - PhotoPlayerUITests
    archive:
      config: Release
