name: iOS Release verification

on:
  push:
    paths:
      - 'PhotoPlayer/**'
      - 'PhotoPlayerUITests/**'
      - 'PhotoPlayerTests/**'
      - 'Config/**'
      - 'project.yml'
      - 'scripts/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      verification:
        description: 'Full verification produces an IPA; frames checks produce evidence only.'
        type: choice
        options: [full, frames]
        default: full

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 70
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      EXPECTED_XCODE_VERSION: '27.1'
      EXPECTED_XCODE_BUILD: '27A9275'
      XCODEGEN_VERSION: '2.46.0'
      XCODEGEN_ASSET_ID: '478866069'
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      SIMULATOR_MODEL: iPhone 17
      SIMULATOR_OS: '27.0'
      FRAME_CHECK_ONLY: ${{ inputs.verification == 'frames' && 'true' || 'false' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require public repository for free standard runner use
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: test "$REPOSITORY_VISIBILITY" = public

      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select and verify pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prepare-ci.sh

      - name: Test IPA validator
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/check_media_policy.py

      - name: Generate and verify synthetic video and audio
        timeout-minutes: 5
        run: |
          bash scripts/generate-fixtures.sh
          bash scripts/generate-frame-fixtures.sh

      - name: Test persistence and PhotoKit playback on one iPhone simulator
        # Includes a cold Release build, 30 serial test hosts and evidence export.
        # The 40-minute job stopped after 87 passing tests with eight still pending.
        # Individual 120/180-second deadlines and every assertion remain unchanged.
        timeout-minutes: 60
        run: bash scripts/test-ios.sh

      - name: Archive and verify unsigned device Release IPA
        if: inputs.verification != 'frames'
        run: bash scripts/archive-ios.sh

      - name: Upload verified device IPA
        if: inputs.verification != 'frames'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhotoPlayer-device-ipa
          path: |
            dist/PhotoPlayer.ipa
            dist/build-info.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload logs and simulator test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence
          path: |
            build/*.log
            build/toolchain.txt
            build/simulators.json
            build/fixture-info.json
            build/fixture-seek-info.json
            build/frame-fixtures/fixture-report.json
            build/TestResults.xcresult
            build/copy-results/
            build/screenshots/
          if-no-files-found: warn
          retention-days: 3
