name: iOS Release verification

on:
  push:
    branches: [main]
    paths:
      - 'PhotoPlayer/**'
      - 'PhotoPlayerUITests/**'
      - 'PhotoPlayerTests/**'
      - 'Config/**'
      - 'project.yml'
      - 'scripts/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      verification:
        description: 'Full verification produces an IPA; focused checks produce evidence only.'
        type: choice
        options: [full, core, library, frames, playback, original, native, regressions, seek, feedback]
        default: full

permissions:
  contents: read

concurrency:
  # Limit overlapping runs on this branch, not the four jobs within a run.
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  EXPECTED_XCODE_VERSION: '27.1'
  EXPECTED_XCODE_BUILD: '27A9275'
  XCODEGEN_VERSION: '2.46.0'
  XCODEGEN_ASSET_ID: '478866069'
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  SIMULATOR_MODEL: iPhone 17
  SIMULATOR_OS: '27.0'

defaults:
  run:
    shell: bash

jobs:
  verify:
    # Four independent free standard VMs; one simulator within each VM.
    # No automatic retries, selective pass aggregation, or looser deadlines.
    # Full verification includes every case exactly once before archiving.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(inputs.verification == 'feedback' && '["feedback"]' || inputs.verification == 'seek' && '["seek"]' || inputs.verification == 'native' && '["native"]' || inputs.verification == 'regressions' && '["selection","original"]' || inputs.verification == 'core' && '["core"]' || inputs.verification == 'library' && '["library"]' || inputs.verification == 'original' && '["original"]' || inputs.verification == 'frames' && '["core","frames"]' || inputs.verification == 'playback' && '["core","playback","original"]' || '["core","library","playback","frames"]') }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      TEST_GROUP: ${{ matrix.group }}
    steps:
      - name: Require public repository for free standard runner use
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: test "$REPOSITORY_VISIBILITY" = public

      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select and verify pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prepare-ci.sh

      - name: Test IPA validator
        if: matrix.group == 'core'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/check_media_policy.py

      - name: Generate and verify synthetic video and audio
        timeout-minutes: 5
        run: |
          bash scripts/generate-fixtures.sh
          bash scripts/generate-frame-fixtures.sh

      - name: Test persistence and PhotoKit playback on one iPhone simulator
        # Individual 120/180-second deadlines and all assertions are unchanged.
        timeout-minutes: 40
        run: bash scripts/test-ios.sh

      - name: Stage complete group test log
        run: cp build/test.log "build/results-${TEST_GROUP}.log"

      - name: Upload group test log for archive gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-test-log-${{ matrix.group }}
          path: build/results-${{ matrix.group }}.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload logs and simulator test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-${{ matrix.group }}
          path: |
            build/*.log
            build/toolchain.txt
            build/simulators.json
            build/fixture-info.json
            build/fixture-seek-info.json
            build/frame-fixtures/fixture-report.json
            build/TestResults.xcresult
            build/copy-results/
            build/screenshots/
          if-no-files-found: warn
          retention-days: 3

  build:
    needs: verify
    if: inputs.verification == '' || inputs.verification == 'full'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Require public repository for free standard runner use
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: test "$REPOSITORY_VISIBILITY" = public

      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select and verify pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prepare-ci.sh

      - name: Check release media policy
        run: python3 scripts/check_media_policy.py

      - name: Download this run's complete test logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-test-log-*
          path: build/verified-tests
          merge-multiple: true

      - name: Require every XCTest exactly once
        run: node scripts/verify-test-results.mjs build/verified-tests | tee build/test-coverage.log

      - name: Archive and verify unsigned device Release IPA
        run: bash scripts/archive-ios.sh

      - name: Upload verified device IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhotoPlayer-device-ipa
          path: |
            dist/PhotoPlayer.ipa
            dist/build-info.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload archive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-archive
          path: |
            build/*.log
            build/toolchain.txt
          if-no-files-found: warn
          retention-days: 3
